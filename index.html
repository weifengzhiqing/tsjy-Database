<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>施工项目数据中心</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="logo">
      <h1>施工项目数据中心</h1>
      <p>计划 · 统计 · 调度</p>
    </div>
    <nav id="nav"></nav>
    <div id="side-foot">v1.0 · 本地运行</div>
  </aside>
  <section id="main">
    <header id="topbar">
      <h2 id="page-title">概览</h2>
      <span class="sub" id="page-sub"></span>
      <span class="sp"></span>
      <span class="dim" id="db-info"></span>
    </header>
    <div id="view"><div class="loading">加载中</div></div>
  </section>
</div>
<div id="toast"></div>

<div id="boot" class="boot-overlay">
  <div class="boot-box">
    <div class="boot-spin"></div>
    <div class="boot-msg" id="boot-msg">正在加载…</div>
    <pre class="boot-err" id="boot-err" style="display:none"></pre>
    <button class="boot-retry" id="boot-retry" style="display:none" onclick="location.reload()">重试</button>
  </div>
</div>
<script>
(function(){
  window.__booting = true;            // 仅启动阶段拦截错误，成功后置 false，避免运行时误弹
  function show(msg){ var b=document.getElementById('boot'); if(b) b.style.display='flex';
    var m=document.getElementById('boot-msg'); if(m && msg) m.textContent=msg; }
  function fail(msg, detail){
    if(!window.__booting) return;     // 启动已完成则不弹全屏浮层
    show('加载失败');
    var err=document.getElementById('boot-err');
    if(err){ err.style.display='block'; err.textContent=(msg||'未知错误')+(detail?('\n\n'+detail):''); }
    var rt=document.getElementById('boot-retry'); if(rt) rt.style.display='inline-block';
  }
  window.__bootShow=show; window.__bootFail=fail;
  window.__bootHide=function(){ window.__booting=false; var b=document.getElementById('boot'); if(b) b.style.display='none'; };
  window.addEventListener('error', function(e){
    if(window.__booting && e && e.target && (e.target.tagName==='SCRIPT'||e.target.tagName==='LINK'))
      fail('资源加载失败：'+(e.target.src||e.target.href||''), '多为云站点休眠，请先点重试；仍不行则硬刷新（Ctrl+Shift+R）');
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r=e&&e.reason; if(window.__booting) fail('脚本运行错误', (r&&(r.stack||r.message))||String(r));
  });
  window.onerror=function(m,s,l,c,err){ if(window.__booting) fail('脚本运行错误', (err&&err.stack)||(m+' @'+s+':'+l)); return false; };
})();
</script>

<script src="js/app.js?v=4"></script>
<!-- 浏览器端后端（SQL.js 数据层 + 各业务模块），必须在 App.boot() 之前加载 -->
<script src="js/backend/db.js?v=4"></script>
<script src="js/backend/common.js?v=4"></script>
<script src="vendor/sql-wasm.js?v=4"></script>
<script src="vendor/xlsx.full.min.js?v=4"></script>
<script src="js/backend/reports.js?v=4"></script>
<script src="js/backend/fileutil.js?v=4"></script>
<script src="js/backend/crud.js?v=4"></script>

<script src="js/backend/export.js?v=4"></script>
<script src="js/backend/extra.js?v=4"></script>
<script src="js/backend/archive.js?v=4"></script>
<script src="js/backend/summary.js?v=4"></script>
<script src="js/backend/api.js?v=4"></script>
<script src="js/chart.js?v=4"></script>
<script src="js/modules/dashboard.js?v=4"></script>
<script src="js/modules/query.js?v=4"></script>
<script src="js/modules/summary.js?v=4"></script>
<script src="js/modules/docgen.js?v=4"></script>
<script src="js/modules/events.js?v=4"></script>
<script src="js/modules/import.js?v=4"></script>
<script src="js/modules/basedata.js?v=4"></script>
<script src="js/modules/measure.js?v=4"></script>
<script src="js/modules/records.js?v=4"></script>
<script src="js/modules/progress_complete.js?v=4"></script>
<script src="js/modules/progress_quick.js?v=4"></script>
<script src="js/modules/progress_view.js?v=4"></script>
<script src="js/modules/cost_input.js?v=4"></script>
<script src="js/modules/profile.js?v=4"></script>
<script src="js/modules/archive_collect.js?v=4"></script>
<script src="js/modules/archive_volume.js?v=4"></script>
<script>App.boot();</script>
</body>
</html>
